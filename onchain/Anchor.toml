[programs.localnet]
onchain_agent_guard = "BL6Fjh4pADgjvZwaueeAcc7rYddFrdMNWnqK73x78ZSs"

[programs.devnet]
onchain_agent_guard = "BL6Fjh4pADgjvZwaueeAcc7rYddFrdMNWnqK73x78ZSs"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"
