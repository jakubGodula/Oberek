# Anchor 1.2.1 workspace template (anchor init) plus the verifier crate overrides at the end.
[workspace]
members = [
    "programs/*"
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
# The template's overflow-checks = true breaks or slows the verifier crates; upstream builds both without them.
# solana-ml-dsa: SBPF v3 codegen fails with "rustc-LLVM ERROR: Branch target out of insn range".
[profile.release.package.solana-ml-dsa]
overflow-checks = false
# solana-falcon512: verify costs ~283k CU instead of ~172k.
[profile.release.package.solana-falcon512]
overflow-checks = false
